android {
  packaging {
      exclude ('lib/armeabi-v7a/libFirebaseCppAnalytics.so')
      exclude ('lib/armeabi-v7a/libFirebaseCppApp-13_0_0.so')
      exclude ('lib/armeabi-v7a/libFirebaseCppRemoteConfig.so')
      exclude ('lib/x86/libFirebaseCppAnalytics.so')
      exclude ('lib/x86/libFirebaseCppApp-13_0_0.so')
      exclude ('lib/x86/libFirebaseCppRemoteConfig.so')
      exclude ('lib/x86_64/libFirebaseCppAnalytics.so')
      exclude ('lib/x86_64/libFirebaseCppApp-13_0_0.so')
      exclude ('lib/x86_64/libFirebaseCppRemoteConfig.so')
  }
}
// Android Resolver Exclusions End
android {
    namespace "com.unity3d.player"
    ndkPath "**NDKPATH**"
    ndkVersion "**NDKVERSION**"

    compileSdk **APIVERSION**
    buildToolsVersion = "**BUILDTOOLS**"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk **MINSDK**
        targetSdk **TARGETSDK**
        ndk {
            abiFilters **ABIFILTERS**
            debugSymbolLevel **DEBUGSYMBOLLEVEL**
        }
        versionCode **VERSIONCODE**
        versionName '**VERSIONNAME**'
        consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**
**DEFAULT_CONFIG_SETUP**
    }

    lint {
        abortOnError false
    }

    androidResources {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }**PACKAGING**
}
